name: Keep Repo Alive

on:
  schedule:
    - cron: "0 0 1,15 * *" # runs on the 1st and 15th of every month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v2
